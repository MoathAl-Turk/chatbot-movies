<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBot - AI Movie Critic</title>
    <!-- Papa Parse CDN for reading the CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>🍿 CineBot</h2>
            <span style="font-size: 14px; color: #aaa;">Your personal AI movie critic</span>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Yo! I'm CineBot. What kind of movie are you looking for today?</div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="e.g. Find me a good sci-fi movie..." autocomplete="off">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
