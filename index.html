<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h2>🍿 CineBot</h2>
            <p>Your personal AI movie critic</p>
        </div>

        <!-- Chat History Area -->
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                Yo! I'm CineBot. What kind of movie are you looking for today? 
            </div>
            <!-- Future messages and movie posters will appear here -->
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="e.g. Find me a good horror movie..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
